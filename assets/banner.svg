<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Animated Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1438;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#242043;#302b63" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#302b63;#24243e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="100%" stop-color="#0abde3"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="100%" stop-color="#f368e0"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#54a0ff"/>
      <stop offset="100%" stop-color="#2e86de"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="350" r="150" fill="rgba(72,219,251,0.04)">
    <animate attributeName="r" values="150;170;150" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="80" r="120" fill="rgba(255,107,107,0.04)">
    <animate attributeName="r" values="120;140;120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle line decoration -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- Title -->
  <text x="80" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" filter="url(#glow)">
    Startup Funds IRR
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="82" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.7)">
    Top Venture Funds &amp; Accelerator Performance Guide
  </text>

  <!-- Accent underline -->
  <rect x="80" y="140" width="320" height="3" rx="1.5" fill="url(#accentGrad)">
    <animate attributeName="width" values="320;360;320" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Chart Label -->
  <text x="80" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">NET IRR PERFORMANCE</text>

  <!-- Chart Bars with IRR data -->
  <!-- Thrive: 126% -->
  <g>
    <rect x="80" y="250" width="252" height="20" rx="4" fill="url(#bar1)">
      <animate attributeName="width" values="0;252;252" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="82" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)">Thrive Capital VIII</text>
    <text x="340" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ff6b6b">126%</text>
  </g>

  <!-- USV 2004: 68% -->
  <g>
    <rect x="80" y="280" width="136" height="20" rx="4" fill="url(#bar2)">
      <animate attributeName="width" values="0;136;136" dur="1.5s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="82" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)">Union Square Ventures '04</text>
    <text x="224" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#feca57">68%</text>
  </g>

  <!-- Founders Fund VIII: 47% -->
  <g>
    <rect x="80" y="310" width="94" height="20" rx="4" fill="url(#bar3)">
      <animate attributeName="width" values="0;94;94" dur="1.5s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="82" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)">Founders Fund VIII</text>
    <text x="182" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#48dbfb">47%</text>
  </g>

  <!-- Benchmark VII: 11x -->
  <g>
    <rect x="80" y="340" width="86" height="20" rx="4" fill="url(#bar4)">
      <animate attributeName="width" values="0;86;86" dur="1.5s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="82" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)">Benchmark Fund VII</text>
    <text x="174" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ff9ff3">~25-30x</text>
  </g>

  <!-- YC: 50-100% -->
  <g>
    <rect x="400" y="250" width="200" height="20" rx="4" fill="url(#bar5)">
      <animate attributeName="width" values="0;200;200" dur="1.5s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="402" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)">Y Combinator (Estimated)</text>
    <text x="608" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#54a0ff">50-100%+</text>
  </g>

  <!-- Right side info panel -->
  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="440" height="200" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Key metric -->
    <text x="30" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2">TOP PERFORMER</text>
    <text x="30" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#00d2ff">126%</text>
    <text x="30" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.5)">Thrive Capital Fund VIII · Net IRR</text>

    <!-- Divider -->
    <line x1="30" y1="110" x2="410" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Stats row -->
    <text x="30" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1">FUNDS TRACKED</text>
    <text x="30" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">8+</text>

    <text x="150" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1">VINTAGE RANGE</text>
    <text x="150" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">2004–2023</text>

    <text x="300" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1">SECTOR</text>
    <text x="300" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">VC / Accelerator</text>
  </g>

  <!-- Dynamic date element (updated on generation) -->
  <text x="80" y="385" font-family="'Courier New', monospace" font-size="11" fill="rgba(255,255,255,0.25)">
    Last updated: 2026-07-30
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- GitHub corner hint -->
  <text x="1100" y="385" font-family="'Courier New', monospace" font-size="11" fill="rgba(255,255,255,0.25)">
    Open Source · MIT
  </text>
</svg>
